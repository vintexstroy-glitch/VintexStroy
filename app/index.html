<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    СТЕНАТА · всичко от собствения адрес, и НИЩО друго освен ВХОДА.
    Шрифтовете, кодът и данните са местни; навън се ходи само за самоличност.
    `ws://localhost` е само за `npm run dev`.

    ЧЕТИРИТЕ ИЗКЛЮЧЕНИЯ СА ИМЕНУВАНИ, не общи (ADR-021):

      script-src  accounts.google.com — скриптът на бутона, теглен САМО при
                  натискане; в готовия пакет и в джоба го няма (правило 10)
      connect-src accounts.google.com — самото влизане
                  www.googleapis.com  — ПУБЛИЧНИТЕ ключове, с които се проверява
                  подписът на жетона; без тях проверката не може да стане
      frame-src   accounts.google.com — прозорчето, в което човек избира акаунт

    Тук НЕ пише „https:" и не пише звезда. Стена, отворена изобщо, е стена,
    свалена. Навън се ходи по ОСЕМ пътя и всеки е изброен ПОИМЕННО, с хост И
    първи сегмент — защото хостът сам не казва нищо:

      · https://accounts.google.com — рамката, в която човек избира акаунт
      · https://accounts.google.com/gsi — скриптът на бутона, теглен САМО при натискане
      · https://www.googleapis.com/oauth2 — публичните ключове, с които се проверява подписът
      · https://www.googleapis.com/drive — Драйвът: файлът на писача се чете и се изрежда (ADR-055)
      · https://www.googleapis.com/upload — същият файл се качва и се презаписва
      · https://www.googleapis.com/calendar — поканата към служителя и отговорът ѝ (ADR-064)
      · https://www.googleapis.com/auth — НЕ Е АДРЕС · това е ИМЕТО на обхвата, което Google иска дословно
      · https://lh3.googleusercontent.com — снимката на профила, ако доставчикът я даде
      · https://api.anthropic.com/v1 — „Пусни с Клод" (ADR-029)

    ЧЕТВЪРТИЯТ ХОСТ ЛИПСВАШЕ и това го намери одитът на И101 т.4: `app/klod.ts`
    праща `fetch` към api.anthropic.com, а стената го спираше — тоест бутонът
    „Пусни с Клод" беше построен, минаваше тестовете (те не викат мрежа) и НЕ
    работеше в истински браузър. Стена, която спира собствения ти изход, е
    по-лоша от липсваща: тя изглежда като работеща защита.

    А ВТОРАТА ПОЛОВИНА на същата находка изплува чак сега, с обратен знак:
    списъкът броеше ЧЕТИРИ ХОСТА и даваше на `www.googleapis.com` ЕДНО
    предназначение — „публичните ключове". Драйвът минаваше по СЪЩИЯ хост от
    ADR-055 насам, НЕОБЯВЕН, и нито един тест не можеше да го види: сверката
    работеше на ниво ХОСТ, а хостът вече беше отворен.

    Тоест списъкът, който се хвали, че е поименен, сам не беше пълен. Сега
    единицата е ПЪТ, не хост, и `tests/stena.test.ts` го сверява в двете посоки.
    Всеки нов изходящ път — включително бъдещият Календар — иска свой ред тук,
    иначе тестът пада.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    img-src 'self' data: https://lh3.googleusercontent.com;
    script-src 'self' https://accounts.google.com;
    connect-src 'self' ws://localhost:* ws://127.0.0.1:* https://accounts.google.com https://www.googleapis.com https://api.anthropic.com;
    frame-src https://accounts.google.com;
    object-src 'none';
    base-uri 'none';
    form-action 'none'">
  <title>MasterBook · Имоти</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#F7F3EC">
  <link rel="icon" href="./ikoni/ikona-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./ikoni/ikona-192.png">
  <link rel="stylesheet" href="./stil.css">
</head>
<body>
  <div id="ekran" class="ekran"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
