name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  proverka:
    name: Пълната проверка · типове · тестове · мерки · проход
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Типове
        run: npm run typecheck

      - name: Инвариантни тестове
        run: npm test

      # Бюджетите за бързина са ДОГОВОР (docs/09 §4б) — при пробив връщат
      # червено. Договор, който CI не пуска, е пожелание.
      - name: Мерки под договор
        run: npm run merki

      - name: Браузър за прохода
        run: npx playwright-core install --with-deps chromium

      # Проходът проверява какво ПИШЕ НА ЕКРАНА. Без него регресия в изгледа
      # минава зелено — точно каквото стана, докато CI пускаше само половината.
      - name: Проход през истински браузър
        run: npm run proba
