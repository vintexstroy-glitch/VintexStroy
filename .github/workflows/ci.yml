name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  proverka:
    name: Пълната проверка · типове · тестове · чистота · мерки · проход
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Типове
        run: npm run typecheck

      - name: Инвариантни тестове
        run: npm test

      # Праговете на чистотата са ДОГОВОР точно като бюджетите за бързина
      # (ADR-048): мъртво 0 · излишен `export` 0 · празно поле 0 · излишен ред 0
      # · несвързан 0 · дублирано 1 с име. CLAUDE.md иска обхода преди всеки
      # коммит; обход, който CI не пуска, разчита на дисциплина вместо на
      # машина — а точно това правило пази от дисциплина.
      - name: Чистотата · деветте обхода
        run: npm run chistota
      - name: Честността на проверките
        run: npm run chestnost

      # Бюджетите за бързина са ДОГОВОР (docs/09 §4б) — при пробив връщат
      # червено. Договор, който CI не пуска, е пожелание.
      - name: Мерки под договор
        run: npm run merki

      - name: Браузър за прохода
        run: npx playwright-core install --with-deps chromium

      # Проходът проверява какво ПИШЕ НА ЕКРАНА. Без него регресия в изгледа
      # минава зелено — точно каквото стана, докато CI пускаше само половината.
      - name: Проход през истински браузър
        run: npm run proba
