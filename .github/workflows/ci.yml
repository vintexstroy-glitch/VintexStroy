name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  proverka:
    name: Типове и инвариантни тестове
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Типове
        run: npm run typecheck

      - name: Инвариантни тестове
        run: npm test
